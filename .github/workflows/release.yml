name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v.dev.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Check package version
        run: |
          if [[ "$GITHUB_REF_NAME" == v.dev.* ]]; then
            VERSION="0.0.0-${GITHUB_REF_NAME#v.}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          PACKAGE_VERSION="$(bun --print 'require("./cli/package.json").version')"

          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version v$VERSION does not match cli/package.json version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Build release artifacts
        run: bun run build

      - name: Stage app artifacts in CLI package
        run: |
          rm -rf cli/app
          mkdir -p cli/app/backend cli/app/frontend
          cp -R backend/dist cli/app/backend/dist
          cp -R frontend/dist cli/app/frontend/dist

      - name: Pack release artifact
        run: |
          if [[ "$GITHUB_REF_NAME" == v.dev.* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v.}"
            PACKAGE_VERSION="0.0.0-${RELEASE_VERSION}"
          else
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            PACKAGE_VERSION="$RELEASE_VERSION"
          fi
          mkdir -p release
          cd cli
          bun pm pack --destination ../release
          cd ..
          mv "release/zeroshot-cli-${PACKAGE_VERSION}.tgz" "release/zeroShot-${RELEASE_VERSION}.tgz"

      - name: Copy installer
        run: |
          if [[ "$GITHUB_REF_NAME" == v.dev.* ]]; then
            VERSION="${GITHUB_REF_NAME#v.}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          sed \
            -e "s|^REPOSITORY=.*|REPOSITORY=\"${GITHUB_REPOSITORY}\"|" \
            -e "s|^VERSION=.*|VERSION=\"${VERSION}\"|" \
            -e "s|^TAG=.*|TAG=\"${GITHUB_REF_NAME}\"|" \
            install.sh > release/install.sh
          chmod +x release/install.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == v.dev.* ]]; then
            VERSION="${GITHUB_REF_NAME#v.}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TITLE="ZeroShot ${GITHUB_REF_NAME}"
          NOTES="Install with: curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh | sh"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "release/zeroShot-${VERSION}.tgz" \
              "release/install.sh" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" \
              "release/zeroShot-${VERSION}.tgz" \
              "release/install.sh" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
