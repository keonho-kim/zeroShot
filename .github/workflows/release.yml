name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v.dev.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Check package version
        run: |
          if [[ "$GITHUB_REF_NAME" == v.dev.* ]]; then
            VERSION="0.0.0-${GITHUB_REF_NAME#v.}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          PACKAGE_VERSION="$(bun --print 'require("./cli/package.json").version')"

          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version v$VERSION does not match cli/package.json version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Build release artifacts
        run: bun run build

      - name: Stage app artifacts in CLI package
        run: |
          rm -rf cli/app
          mkdir -p cli/app/backend cli/app/frontend
          cp -R backend/dist cli/app/backend/dist
          cp -R frontend/dist cli/app/frontend/dist

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN repository secret is required to publish @keonhokim/zeroshot." >&2
            exit 1
          fi

          printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"

          PACKAGE_NAME="$(bun --print 'require("./cli/package.json").name')"
          PACKAGE_VERSION="$(bun --print 'require("./cli/package.json").version')"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            npm dist-tag add "${PACKAGE_NAME}@${PACKAGE_VERSION}" latest
          else
            cd cli
            npm publish --access public --tag latest
          fi

      - name: Pack release artifact
        run: |
          if [[ "$GITHUB_REF_NAME" == v.dev.* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v.}"
            PACKAGE_VERSION="0.0.0-${RELEASE_VERSION}"
          else
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            PACKAGE_VERSION="$RELEASE_VERSION"
          fi
          mkdir -p release
          cd cli
          bun pm pack --destination ../release
          cd ..
          mv release/*.tgz "release/zeroShot-${RELEASE_VERSION}.tgz"

      - name: Copy installer
        run: |
          if [[ "$GITHUB_REF_NAME" == v.dev.* ]]; then
            VERSION="${GITHUB_REF_NAME#v.}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          sed \
            -e "s|^REPOSITORY=.*|REPOSITORY=\"${GITHUB_REPOSITORY}\"|" \
            -e "s|^VERSION=.*|VERSION=\"${VERSION}\"|" \
            -e "s|^TAG=.*|TAG=\"${GITHUB_REF_NAME}\"|" \
            install.sh > release/install.sh
          chmod +x release/install.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == v.dev.* ]]; then
            VERSION="${GITHUB_REF_NAME#v.}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TITLE="ZeroShot ${GITHUB_REF_NAME}"
          NOTES="$(printf 'Install with:\n\nnpm install -g @keonhokim/zeroshot\nbun install -g @keonhokim/zeroshot\n\nLatest GitHub installer:\n\ncurl -fsSL https://github.com/%s/releases/latest/download/install.sh | sh\n\nPinned GitHub installer:\n\ncurl -fsSL https://github.com/%s/releases/download/%s/install.sh | sh' "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME")"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "release/zeroShot-${VERSION}.tgz" \
              "release/install.sh" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              "release/zeroShot-${VERSION}.tgz" \
              "release/install.sh" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
